<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">ProofStamp AI</title>
  <desc id="desc">ProofStamp AI banner. Verifiable evidence for AI sessions.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071c33"/>
      <stop offset="1" stop-color="#0b2743"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1100 56) rotate(132) scale(420 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#15c9ba" stop-opacity=".17"/>
      <stop offset="1" stop-color="#15c9ba" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>

  <!-- Official ProofStamp mark, matched to docs/assets/proofstamp-mark.svg -->
  <rect x="60" y="50" width="80" height="80" rx="22" fill="#ffffff" fill-opacity=".025" stroke="#ffffff" stroke-opacity=".08"/>
  <g transform="translate(68 58) scale(.25)">
    <rect width="256" height="256" rx="64" fill="#071c33"/>
    <rect x="36" y="36" width="184" height="184" rx="48" fill="none" stroke="#15c9ba" stroke-width="10"/>
    <text x="128" y="151" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" letter-spacing="-4">PS</text>
  </g>

  <text x="154" y="79" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="1.2">PROOFSTAMP</text>
  <rect x="306" y="58" width="44" height="27" rx="13.5" fill="#15c9ba" fill-opacity=".13" stroke="#15c9ba" stroke-opacity=".45"/>
  <text x="328" y="76" text-anchor="middle" fill="#8af4e9" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">AI</text>

  <text x="64" y="170" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" letter-spacing="-.8">Make AI evidence verifiable.</text>
  <text x="64" y="213" fill="#b9c8d6" font-family="Arial, Helvetica, sans-serif" font-size="20">Capture what the host exposes. Verify the exact bytes. Keep the receipt.</text>

  <g transform="translate(64 270)" font-family="Arial, Helvetica, sans-serif">
    <g>
      <circle cx="8" cy="8" r="8" fill="#15c9ba" fill-opacity=".16" stroke="#15c9ba" stroke-opacity=".7"/>
      <path d="M4.8 8.3 7.1 10.6 11.8 5.6" fill="none" stroke="#8af4e9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="27" y="13" fill="#e7eef5" font-size="14" font-weight="700">Capture</text>
    </g>
    <path d="M98 8H156" stroke="#45627c" stroke-width="1.5" stroke-dasharray="3 5"/>
    <g transform="translate(174)">
      <circle cx="8" cy="8" r="8" fill="#15c9ba" fill-opacity=".16" stroke="#15c9ba" stroke-opacity=".7"/>
      <path d="M4.8 8.3 7.1 10.6 11.8 5.6" fill="none" stroke="#8af4e9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="27" y="13" fill="#e7eef5" font-size="14" font-weight="700">Verify</text>
    </g>
    <path d="M272 8H330" stroke="#45627c" stroke-width="1.5" stroke-dasharray="3 5"/>
    <g transform="translate(348)">
      <circle cx="8" cy="8" r="8" fill="#15c9ba" fill-opacity=".16" stroke="#15c9ba" stroke-opacity=".7"/>
      <path d="M4.8 8.3 7.1 10.6 11.8 5.6" fill="none" stroke="#8af4e9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="27" y="13" fill="#e7eef5" font-size="14" font-weight="700">Keep</text>
    </g>
  </g>

  <!-- Evidence receipt motif -->
  <g transform="translate(856 48)">
    <rect x="0" y="0" width="350" height="264" rx="22" fill="#0a223b" stroke="#294760"/>
    <rect x="24" y="24" width="302" height="42" rx="12" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".07"/>
    <circle cx="45" cy="45" r="8" fill="#15c9ba"/>
    <path d="M41.5 45.2 44.3 48l5.2-5.8" fill="none" stroke="#071c33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="41" fill="#9eb3c6" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="1.2">EXACT BYTES</text>
    <text x="64" y="55" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Verified</text>

    <text x="24" y="101" fill="#7890a5" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="1.2">SHA-256</text>
    <rect x="24" y="113" width="302" height="54" rx="12" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".07"/>
    <text x="42" y="145" fill="#dbe6ee" font-family="monospace" font-size="13">9f21d0a7…b84e31c2</text>

    <path d="M24 193H326" stroke="#294760"/>
    <text x="24" y="219" fill="#7890a5" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="1.2">PORTABLE RECEIPT</text>
    <text x="24" y="243" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Inspectable. Detached. Yours.</text>
  </g>
</svg>
