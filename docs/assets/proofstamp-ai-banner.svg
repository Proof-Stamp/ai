<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">ProofStamp AI</title>
  <desc id="desc">ProofStamp AI repository banner with a verified receipt motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf8fa"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#071c33" stroke-opacity=".045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#071c33" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <path d="M0 359.5H1280" stroke="#d8e3ea"/>

  <g transform="translate(72 62)">
    <rect width="58" height="58" rx="16" fill="#071c33"/>
    <rect x="9" y="9" width="40" height="40" rx="11" fill="none" stroke="#15c9ba" stroke-width="2"/>
    <text x="29" y="36" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">PS</text>
  </g>

  <text x="150" y="92" fill="#071c33" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing=".4">PROOFSTAMP</text>
  <rect x="307" y="70" width="48" height="28" rx="14" fill="#d9fbf7" stroke="#a5eae3"/>
  <text x="331" y="89" text-anchor="middle" fill="#08796f" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">AI</text>

  <text x="72" y="176" fill="#071c33" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700">Portable evidence for AI sessions.</text>
  <text x="72" y="218" fill="#51677c" font-family="Arial, Helvetica, sans-serif" font-size="20">Capture what the host exposes. Verify the exact bytes. Keep the receipt.</text>

  <g transform="translate(72 258)">
    <circle cx="9" cy="9" r="9" fill="#d9fbf7"/>
    <path d="M5.4 9.2 8 11.8l4.8-5.2" fill="none" stroke="#08796f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="14" fill="#071c33" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Exact-byte SHA-256 verification</text>

    <circle cx="287" cy="9" r="9" fill="#d9fbf7"/>
    <path d="M283.4 9.2 286 11.8l4.8-5.2" fill="none" stroke="#08796f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="306" y="14" fill="#071c33" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Detached receipt</text>

    <circle cx="471" cy="9" r="9" fill="#d9fbf7"/>
    <path d="M467.4 9.2 470 11.8l4.8-5.2" fill="none" stroke="#08796f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="490" y="14" fill="#071c33" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Explicit limitations</text>
  </g>

  <g transform="translate(908 54) rotate(2 145 126)" filter="url(#shadow)">
    <rect width="290" height="252" rx="22" fill="#071c33"/>
    <text x="28" y="42" fill="#9eb3c6" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.3">PROOFSTAMP RECEIPT</text>
    <rect x="180" y="24" width="82" height="28" rx="14" fill="#0d3e4b" stroke="#1d7b75"/>
    <text x="221" y="42" text-anchor="middle" fill="#8af4e9" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700">VERIFIED</text>
    <path d="M28 70H262" stroke="#21405d"/>
    <text x="28" y="101" fill="#9eb3c6" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="1.1">SHA-256</text>
    <rect x="28" y="116" width="234" height="54" rx="10" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="44" y="146" fill="#d9e4ed" font-family="monospace" font-size="12">9f21d0a7…b84e31c2</text>
    <text x="28" y="202" fill="#9eb3c6" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="1.1">CONVERSATION COVERAGE</text>
    <text x="28" y="226" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="14">Not independently confirmed</text>
  </g>
</svg>
