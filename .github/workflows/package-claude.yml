name: package-claude-skill

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the Claude skill package to
        required: true
        default: v0.1.3
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Claude skill package
        run: python scripts/build_claude_skill.py

      - name: Validate ZIP layout
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          path = 'dist/claude/proofstamp.zip'
          with ZipFile(path) as zf:
              names = zf.namelist()
              assert 'proofstamp/skill.md' in names
              assert 'proofstamp/SKILL.md' not in names
              assert all(name.startswith('proofstamp/') for name in names)
          print(path)
          PY

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: proofstamp-claude-skill
          path: dist/claude/proofstamp.zip
          if-no-files-found: error

      - name: Attach package to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.tag }}
        run: gh release upload "$TAG" dist/claude/proofstamp.zip --clobber
