name: package-claude-skill

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the Claude skill package to
        required: true
        default: v0.1.6
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository with tag history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set package tag
        id: package_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Use canonical ProofStamp source from release tag
        shell: bash
        run: |
          git rev-parse --verify "refs/tags/${{ steps.package_tag.outputs.tag }}"
          git checkout "${{ steps.package_tag.outputs.tag }}" -- proofstamp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Claude skill package
        run: python scripts/build_claude_skill.py

      - name: Validate ZIP layout
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          path = 'dist/claude/proofstamp.zip'
          with ZipFile(path) as zf:
              names = zf.namelist()
              assert 'proofstamp/skill.md' in names
              assert 'proofstamp/SKILL.md' not in names
              assert all(name.startswith('proofstamp/') for name in names)
          print(path)
          PY

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: proofstamp-claude-skill-${{ steps.package_tag.outputs.tag }}
          path: dist/claude/proofstamp.zip
          if-no-files-found: error

      - name: Attach package to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package_tag.outputs.tag }}
        run: gh release upload "$TAG" dist/claude/proofstamp.zip --clobber
